{% include 'cabecalho.html' %}

<h1 class="mb-4">Listagem de turmas</h1>
<div class="row">
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Semestre</th>
        <th>Curso</th>
        <th>Aluno ID</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for item in lista_turma %}
      <tr>
        <td>{{ item[0] }}</td>   <!-- id -->
        <td>{{ item[1] }}</td>   <!-- semestre -->
        <td>{{ item[2] }}</td>   <!-- curso -->
        <td>{{ item[3] }}</td>   <!-- aluno_id -->
        <td>
          <a href="/turma/editar/{{ item[0] }}" class="btn btn-primary btn-sm">Editar</a>
          <a href="/turma/remover/{{ item[0] }}" class="btn btn-danger btn-sm"
             onclick="return confirm('Tem certeza que deseja remover esta turma?');">
             Remover
          </a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

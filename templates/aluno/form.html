{% include 'cabecalho.html' %}

<h1 class="mb-4">{{ 'Editar Aluno' if aluno else 'Cadastrar Aluno' }}</h1>

<form action="/aluno/salvar/{{ aluno[0] if aluno else '' }}" method="post">

  <div class="mb-3">
    <label for="nome" class="form-label">Nome</label>
    <input type="text" id="nome" name="nome" class="form-control"
          value="{{ aluno[1] if aluno else '' }}" required>
  </div>

  <div class="mb-3">
    <label for="idade" class="form-label">Idade</label>
    <input type="number" id="idade" name="idade" class="form-control"
          value="{{ aluno[2] if aluno else '' }}" required>
  </div>

  <div class="mb-3">
    <label for="cidade" class="form-label">Cidade</label>
    <input type="text" id="cidade" name="cidade" class="form-control"
          value="{{ aluno[3] if aluno else '' }}" required>
  </div>

  <button type="submit" class="btn btn-primary">Salvar</button>
  <a href="/aluno" class="btn btn-secondary">Cancelar</a>
</form>
